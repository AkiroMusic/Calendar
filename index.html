<!DOCTYPE html>
<html lang="en">
  <head>
    <!-- BLOCKING: Apply theme + font-size before first paint to prevent flash -->
    <script>
      (function() {
        try {
          var theme = localStorage.getItem('calendar-diary-theme') || 'dark';
          document.documentElement.setAttribute('data-theme', theme);
          var fontSize = localStorage.getItem('calendar-diary-font-size') || 'medium';
          document.documentElement.setAttribute('data-font-size', fontSize);
        } catch(e) {}
      })();
    </script>

    <!-- BLOCKING: CSS variables defined synchronously before Tailwind loads -->
    <style>
      :root, [data-theme="dark"] {
        --color-paper: #0d0d0d;
        --color-paper-dark: #1a1a1a;
        --color-ink-red: #e63946;
        --color-ink-blue: #4a8bc2;
        --color-ink-black: #e0e0e0;
        --color-surface: #1a1a1a;
        --color-surface-hover: #252525;
        --color-surface-border: #333333;
        --color-text-secondary: #888888;
        --color-input-bg: #2a2a2a;
      }
      [data-theme="light"] {
        --color-paper: #faf7f2;
        --color-paper-dark: #f0ece6;
        --color-ink-red: #dc2626;
        --color-ink-blue: #2563eb;
        --color-ink-black: #1f2937;
        --color-surface: #ffffff;
        --color-surface-hover: #f5f3ef;
        --color-surface-border: #e5e2dc;
        --color-text-secondary: #8b7f70;
        --color-input-bg: #f5f3ef;
      }
      html {
        font-size: 16px;
      }
      [data-font-size="small"] { font-size: 14px; }
      [data-font-size="large"] { font-size: 18px; }
      body {
        background-color: var(--color-paper);
        color: var(--color-ink-black);
      }
    </style>

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calendar - 日历日记</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              serif: ['"Playfair Display"', 'Georgia', 'serif'],
              sans: ['"Inter"', 'system-ui', 'sans-serif'],
              hand: ['"Comic Sans MS"', '"Chalkboard SE"', 'sans-serif'],
            },
            colors: {
              paper: 'var(--color-paper)',
              'paper-dark': 'var(--color-paper-dark)',
              'ink-red': 'var(--color-ink-red)',
              'ink-blue': 'var(--color-ink-blue)',
              'ink-black': 'var(--color-ink-black)',
              'surface': 'var(--color-surface)',
              'surface-hover': 'var(--color-surface-hover)',
              'surface-border': 'var(--color-surface-border)',
              'text-secondary': 'var(--color-text-secondary)',
              'input-bg': 'var(--color-input-bg)',
            }
          }
        }
      }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Playfair+Display:wght@400;700&display=swap" rel="stylesheet">
    <style>
      /* Custom scrollbar for a cleaner look */
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: #444; 
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #666; 
      }
      .spiral-holes {
        background-image: radial-gradient(circle, #666 20%, transparent 25%);
        background-size: 20px 20px;
        background-position: 0 0;
        background-repeat: repeat-x;
        height: 20px;
        opacity: 0.15;
      }
      
      /* Electron Drag Regions */
      .draggable {
        -webkit-app-region: drag;
      }
      .non-draggable {
        -webkit-app-region: no-drag;
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "lucide-react": "https://aistudiocdn.com/lucide-react@^0.554.0",
    "react/": "https://aistudiocdn.com/react@^19.2.0/",
    "react": "https://aistudiocdn.com/react@^19.2.0",
    "@google/genai": "https://aistudiocdn.com/@google/genai@^1.30.0",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",
    "date-fns": "https://aistudiocdn.com/date-fns@^4.1.0"
  }
}
</script>
<link rel="stylesheet" href="./index.css">

</head>
  <body class="overflow-hidden text-ink-black h-screen w-screen bg-paper">
    <div id="root" class="w-full h-full"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
